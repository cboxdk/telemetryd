name: Homebrew formula

# Deliberately its own workflow rather than a step in the release.
#
# Two reasons, both learned the hard way. `publish-formula.py` reads the digests from
# the *published* `SHA256SUMS`, so it cannot run before the release exists — as a step
# inside the release job it sat above `publish release` and would have 404'd on the
# first tag after the token was set, failing the job with the artifacts built, signed,
# and never published.
#
# And a tap that cannot be written to is not a reason to lose a release. Here the worst
# case is that Homebrew serves the previous version until this is re-run, which is
# visible, recoverable, and costs nobody their release.

# `workflow_run`, not `release: published`. The release is created by the release
# workflow using GITHUB_TOKEN, and events raised by GITHUB_TOKEN deliberately do not
# trigger further workflows — otherwise a workflow could set itself off forever. So
# `release: published` looked correct, was accepted by GitHub, and would simply never
# have fired. v0.13.1 is where that was noticed: the release went green and the tap
# stayed on the previous version.
#
# `release: published` is kept for a release published by hand, which does carry a
# human's identity and does trigger.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (must already be published)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to cboxdk/homebrew-tap
    runs-on: ubuntu-latest
    # A failed release has nothing worth publishing a formula for.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Not the key itself — only whether one is configured. The `secrets` context is
    # not available in a step's `if`, and putting a private key in a job-level `env`
    # would hand it to every step in the job for no reason.
    env:
      HAS_APP_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY != '' }}
    steps:
      # Check out the *tag*, not the default branch: `packaging/telemetryd.rb` is
      # versioned with the code it installs, and publishing the formula as it exists on
      # main would describe a build that tag never produced.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}

      # A GitHub App rather than a personal access token: the App's own credentials
      # never expire, so nothing silently stops working on a date nobody wrote down,
      # and what reaches the runner is an installation token that dies an hour later.
      # It is also not tied to a person — a PAT leaves with whoever created it.
      #
      # Narrowed to the one repository it may write. An installation token inherits the
      # App's permissions across everything it is installed on unless you say otherwise.
      - name: mint an installation token
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # `client-id` rather than the deprecated `app-id`. It identifies the App and
          # is not a credential — anyone in the organisation can read it back from the
          # installations API — so it is written here rather than kept as a secret. The
          # private key is the secret, and it is the only one this workflow needs.
          client-id: Iv23li8OLb7KeHwdoKGw
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: cboxdk
          repositories: homebrew-tap

      # Skipped, loudly, when the App is not configured. A tap that silently stops
      # being updated looks exactly like one that is up to date, and `brew install`
      # would go on serving the previous release without anyone noticing.
      - name: publish the Homebrew formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          # `workflow_run.head_branch` is whatever ref set the release workflow off.
          # For a tag push that is the tag, but it is not guaranteed to be one, and a
          # formula published from the wrong ref would describe a build that ref never
          # produced. Refuse rather than guess.
          case "${TAG}" in
            v[0-9]*) ;;
            *)
              echo "::warning::'${TAG}' is not a release tag, so nothing was published \
          to the tap. Run this workflow manually with the tag if that is wrong."
              exit 0
              ;;
          esac

          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::No installation token, so cboxdk/homebrew-tap still serves \
          the previous release. Check HOMEBREW_APP_PRIVATE_KEY, or \
          publish by hand with: python3 scripts/publish-formula.py ${TAG}"
            exit 0
          fi
          # The script pushes with plain git. Locally that rides on SSH; a runner has
          # no key, so point git's credential helper at the token gh is already using.
          gh auth setup-git
          python3 scripts/publish-formula.py "${TAG}"
