name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Must equal the channel in rust-toolchain.toml; the check job asserts it. CI
  # cannot simply track `stable`: cargo would obey the pin while the action installed
  # target std for a different compiler, and the MSRV job would silently test the
  # pinned version instead of the minimum.
  RUST_VERSION: "1.97.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The pin is only worth having if both halves move together. If they drift,
      # cargo obeys the file and every other job's assumption is wrong.
      - name: the pinned toolchain matches rust-toolchain.toml
        run: |
          PINNED=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ "$PINNED" != "${RUST_VERSION}" ]; then
            echo "::error::rust-toolchain.toml pins $PINNED but RUST_VERSION is ${RUST_VERSION}"
            exit 1
          fi
          echo "both pinned to $PINNED"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items

      # Runs the actual binary over HTTP: all three signals in, queried back out,
      # restarted, checked again. Every unit test passed on a release that shipped a
      # TraceQL endpoint rejecting its own documented syntax — nothing in the suite
      # was starting the server and asking it a question.
      - name: end-to-end soak
        run: |
          cargo build --bin telemetryd
          python3 scripts/soak.py target/debug/telemetryd

  supply-chain:
    name: SBOM and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # The SBOM is committed, so this is a real drift check: it fails exactly when a
      # dependency changed and the manifest was not regenerated.
      - name: SBOM is not stale
        run: python3 scripts/generate-sbom.py --check

      # Structure, frontmatter and dangling links. A moved doc that leaves a dead link
      # is the most common way documentation rots.
      - name: docs meet the standard
        run: python3 scripts/check-docs.py

      - name: install script is valid POSIX sh
        run: sh -n install.sh

      - name: shellcheck the installer
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh"

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --hide-inclusion-graph

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+${{ ... }}` is load-bearing: rust-toolchain.toml would otherwise redirect
      # cargo to the pinned compiler and this job would pass without ever exercising
      # the minimum version it exists to check.
      #
      # Build only: the MSRV claim is about compiling telemetryd, and dev-dependencies
      # routinely require a newer toolchain than the crates themselves.
      - run: cargo +${{ steps.msrv.outputs.version }} build --workspace

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin telemetryd
          else
            cargo build --release --target ${{ matrix.target }} --bin telemetryd
          fi

      # "One static binary, no runtime deps, no glibc surprises" is a product
      # constraint, not an aspiration. A musl build that quietly picked up a dynamic
      # interpreter would still pass every test we have, so assert it here.
      - name: verify the musl build is statically linked
        if: contains(matrix.target, 'musl')
        run: |
          BIN=target/${{ matrix.target }}/release/telemetryd
          file "$BIN"
          if file "$BIN" | grep -q "dynamically linked"; then
            echo "::error::${{ matrix.target }} produced a dynamically linked binary"
            exit 1
          fi

      # Cross-compiled artifacts cannot run here; the two we can execute, we do.
      - name: smoke test the native binary
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN=target/${{ matrix.target }}/release/telemetryd
          if [ "${{ matrix.cross }}" = "true" ]; then
            docker run --rm -v "$PWD:/w" -w /w alpine:3 "$BIN" version
          else
            "$BIN" version
            "$BIN" validate --data-dir "$RUNNER_TEMP/telemetryd-data"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: telemetryd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/telemetryd
          if-no-files-found: error
          retention-days: 7

  # A single required check, so branch protection does not need updating every time
  # the matrix changes.
  ci:
    name: ci
    if: always()
    needs: [check, deny, msrv, supply-chain, build]
    runs-on: ubuntu-latest
    steps:
      # Parsed with jq rather than grep. The grep version worked, but only because
      # execution fell through to a trailing `echo` that reset the exit status — the
      # kind of correctness that survives until someone edits the last line.
      #
      # This also names which job failed instead of printing the whole blob, and takes
      # `needs` through the environment rather than interpolating it into the script,
      # so a job name can never terminate the quoting and run as shell.
      - name: verify every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # Anything not "success" fails the gate, including "skipped" — a job that
          # never ran has not verified anything.
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::jobs that did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "all jobs succeeded"
