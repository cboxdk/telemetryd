# Publish the container image.
#
# Triggered by `workflow_run` rather than `release: published`, for the same reason
# formula.yml is: a release created by GITHUB_TOKEN does not raise events that start
# other workflows, so keying off the release would produce a job that never runs. It
# also has to wait for the release to exist, because it builds from the *published*
# assets and their SHA256SUMS — starting earlier would 404.
name: docker

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.21.0"
        required: true

# Nothing by default; each job asks for what it uses. `id-token` in particular is held
# only by the job that signs, which runs no third-party build action — it was granted
# to the whole workflow, build steps included.
permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.tag.outputs.version }}
    # `conclusion` rather than just the event: a failed release must not be packaged.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      # Through the environment, never `${{ }}` inside the script: the tag is text
      # whoever dispatches the workflow or pushes a tag chooses, and interpolated into
      # `run:` it was shell for this job to execute. Then held to the shape of a
      # release tag before anything else sees it.
      - name: work out which tag to build
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RUN_BRANCH"
          fi
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::not a release tag; nothing to publish"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A pre-release — `v1.2.0-rc.1` — is published under its own version and
          # never as `latest`: someone pulling `latest` asked for the current release,
          # and an rc tag used to hand them the candidate instead.
          case "$TAG" in
            *-*) echo "latest=" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=ghcr.io/${GITHUB_REPOSITORY}:latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # The tag's own Dockerfile and scripts, not whatever main holds by the time this
      # runs: a `workflow_run` checks out the default branch unless told otherwise, so
      # an image could be built for one release by the next one's recipe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      # Fails loudly on a checksum mismatch, so a tampered or half-uploaded asset
      # cannot become an image.
      - name: assemble the build context from the published release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/docker-context.py release "$TAG"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.latest }}
          labels: |
            org.opencontainers.image.title=telemetryd
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true

      # The image is only useful if it starts, and every check here is one that has
      # actually been got wrong before: a binary for the wrong architecture, an
      # entrypoint that cannot write its token file, a healthcheck pointing at a port
      # nothing listens on.
      - name: the published image has to actually run
        run: |
          set -eu
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}"
          docker run -d --name smoke -p 4319:4319 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4319/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            [ "$i" = "30" ] && { docker logs smoke; exit 1; }
            sleep 1
          done

          # The generated token must be usable — read from the file it is kept in, since
          # it is not printed — and must not appear in the container log.
          TOKEN="$(docker exec smoke sh -c '. /var/lib/telemetryd/generated-tokens.env && printf %s "$TELEMETRYD_AUTH_INGEST_TOKEN"')"
          [ -n "$TOKEN" ] || { echo "::error::no ingest token was generated"; docker logs smoke; exit 1; }
          if docker logs smoke 2>&1 | grep -qF "$TOKEN"; then
            echo "::error::the generated token was printed to the container log"; exit 1
          fi
          curl -fsS -XPOST http://127.0.0.1:4319/v1/logs \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"smoke"}}]},"scopeLogs":[{"logRecords":[{"timeUnixNano":"1","body":{"stringValue":"hello"}}]}]}]}' \
            >/dev/null

          # Unauthenticated writes must still be refused — the generated token is only
          # worth anything if the absence of one is a 401.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -XPOST http://127.0.0.1:4319/v1/logs \
            -H 'content-type: application/json' -d '{}')"
          [ "$CODE" = "401" ] || { echo "::error::unauthenticated write got $CODE, expected 401"; exit 1; }

          # SIGTERM must reach telemetryd through cbox-init and produce a clean stop —
          # if it does not, every restart becomes a crash recovery.
          docker stop -t 45 smoke >/dev/null
          docker logs smoke 2>&1 | tail -20
          docker inspect -f '{{.State.ExitCode}}' smoke | grep -qx 0 \
            || { echo "::error::the container did not shut down cleanly"; exit 1; }

  # Signing on its own, holding the one credential nothing else needs.
  sign:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      # Keyless signing, matching how the release binaries are signed.
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cosign sign --yes "$IMAGE"
