name: Fuzz

# Not part of the merge gate. Fuzzing is a search, not a verdict: a clean sixty seconds
# proves very little, and making a merge wait on one would trade real signal for the
# appearance of it. This runs nightly, and on demand when a parser changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        default: "5"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [logql, traceql, promql, otlp_logs, remote_write, body_decompression]
    steps:
      - uses: actions/checkout@v7
      # libFuzzer needs nightly, which is why this is a separate workflow rather than a
      # job in CI: the rest of the project is pinned, deliberately.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: fuzz ${{ matrix.target }}
        run: |
          SECONDS_PER_TARGET=$(( ${{ github.event.inputs.minutes || 5 }} * 60 ))
          # `+nightly` explicitly. Installing nightly is not enough: rust-toolchain.toml
          # pins 1.97.1 and rustup honours the file over the installed default, so
          # `cargo fuzz` resolved to stable and died on `-Z sanitizer=address`.
          #
          # And the corpus directory has to exist. Only the seeds are committed — the
          # corpus is generated — so on a fresh checkout libFuzzer's first positional
          # argument names a directory that is not there, and it refuses to start.
          # Order matters and is not alphabetical: libFuzzer *writes* to the first
          # directory, so the corpus goes first and the seeds stay read-only.
          # `--target` explicitly, because cargo-fuzz defaults it to the triple
          # *cargo-fuzz itself* was built for rather than the host's. install-action
          # ships a static musl build, so it picked musl on a gnu runner — and ASAN
          # cannot link against a static libc: "sanitizer is incompatible with
          # statically linked libc". Locally the same command picks the host and works,
          # which is exactly why this never showed up until it ran here.
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time="${SECONDS_PER_TARGET}" -print_final_stats=1

      # A crashing input is the whole product of a run. Keep it, or the next person
      # has to rediscover it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
