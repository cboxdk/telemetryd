doc = false
bench = false

[[bin]]
name = "otlp_logs"
path = "fuzz_targets/otlp_logs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_write"
path = "fuzz_targets/remote_write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body_decompression"
path = "fuzz_targets/body_decompression.rs"
test = false
