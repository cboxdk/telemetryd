[package]
name = "telemetryd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
telemetryd-core = { path = "../crates/core" }
telemetryd-ingest = { path = "../crates/ingest" }
telemetryd-query = { path = "../crates/query" }

[[bin]]
name = "logql"
path = "fuzz_targets/logql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traceql"
