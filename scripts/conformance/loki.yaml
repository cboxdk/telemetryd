# Loki for scripts/loki-conformance.py: one process, in memory and on the container's
# own disk, accepting the fixed, old timestamps the cases are written with.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  max_query_lookback: 0s
  allow_structured_metadata: true

querier:
  # The cases' lines are older than any default window; read them from the ingester.
  query_ingesters_within: 0s

query_range:
  align_queries_with_step: false
  cache_results: false

analytics:
  reporting_enabled: false
