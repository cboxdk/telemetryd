# A replicated ClickHouse cluster for the tests that run telemetryd against one: a
# Keeper and two replicas of one shard, named `td`, user and password `td`.
#
#   docker compose -f scripts/clickhouse/compose.yml up -d --wait
#   TELEMETRYD_TEST_CLICKHOUSE_URL=http://td:td@127.0.0.1:18124 \
#   TELEMETRYD_TEST_CLICKHOUSE_CLUSTER=td \
#   TELEMETRYD_TEST_CLICKHOUSE_REPLICAS=http://td:td@127.0.0.1:18124,http://td:td@127.0.0.1:18125 \
#     cargo test -p telemetryd-server -p telemetryd-query
#
# Pinned by digest, as the actions are: 25.8, the LTS line telemetryd is tested on.
name: telemetryd-clickhouse
services:
  keeper:
    image: clickhouse/clickhouse-keeper:25.8@sha256:86ef98ab9c41998c562806a062ef1079af07755f6bcec0a46e9caa9b7a4b4253
    volumes: ["./keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro"]
  ch1: &replica
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_USER: td
      CLICKHOUSE_PASSWORD: td
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["./ch1.xml:/etc/clickhouse-server/config.d/cluster.xml:ro"]
    ports: ["18124:8123"]
    depends_on: [keeper]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 30
  ch2:
    <<: *replica
    volumes: ["./ch2.xml:/etc/clickhouse-server/config.d/cluster.xml:ro"]
    ports: ["18125:8123"]
